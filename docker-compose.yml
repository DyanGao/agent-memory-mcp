# Everything is published on 127.0.0.1 only. Memories must not be reachable
# from the network.
x-app: &app
  build: .
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &app-env
    APP_DATABASE_URL: postgres://memory_app:${MEMORY_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent_memory}
    # Runs on the host by default: Docker on a Mac has no GPU access. On Linux,
    # use the bundled service with OLLAMA_CONTAINER_URL=http://ollama:11434
    # and `docker compose --profile ollama up -d`.
    OLLAMA_URL: ${OLLAMA_CONTAINER_URL:-http://host.docker.internal:11434}
    EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
    DISTILL_MODEL: ${DISTILL_MODEL:-ollama:qwen3}
    RETENTION_DAYS: ${RETENTION_DAYS:-365}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-memory_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agent_memory}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    <<: *app
    environment:
      <<: *app-env
      DATABASE_URL: postgres://${POSTGRES_USER:-memory_owner}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agent_memory}
      MEMORY_APP_PASSWORD: ${MEMORY_APP_PASSWORD:?Set MEMORY_APP_PASSWORD in .env}
      MEMORY_API_KEY: ${MEMORY_API_KEY:?Set MEMORY_API_KEY in .env}
      # Inside the container only. The port below is what limits access.
      HOST: 0.0.0.0
    ports:
      - "127.0.0.1:${PORT:-8787}:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8787/health').then((r) => process.exit(r.ok ? 0: 1), () => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *app
    command: ["node", "packages/distiller/dist/worker.js"]
    depends_on:
      # The server applies migrations, which the worker needs.
      server:
        condition: service_healthy

  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.32.1
    volumes:
      - ollama:/root/.ollama

volumes:
  pgdata:
  ollama:
